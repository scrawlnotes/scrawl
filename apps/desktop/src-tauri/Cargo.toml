[package]
name = "scrawl"
version = "0.1.16"
description = "Scrawl desktop app"
license = "MIT"
edition = "2021"

[lib]
name = "scrawl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
keyring = "4"
notify-debouncer-full = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "form", "http2", "system-proxy"] }
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "rt"] }

# Files copied in Explorer, read from the clipboard when they are pasted into a note.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
# A message's notification of Scrawl's own, which the next of its conversation replaces and reading it takes away.
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications"] }
