[package]
name = "scrawl"
version = "0.1.8"
description = "Scrawl desktop app"
license = "MIT"
edition = "2021"

[lib]
name = "scrawl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "form", "http2", "system-proxy"] }
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "rt"] }

# Files copied in Explorer, read from the clipboard when they are pasted into a note.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"