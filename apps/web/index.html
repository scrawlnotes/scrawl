<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Edge to edge on a phone; the app keeps its own distance from the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scrawl</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- Added to a home screen, it opens as an app of its own; the bar above it takes the theme's colour. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1e2229" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scrawl" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Until the app's code comes the page is never white: the theme this device keeps, or its light
         or dark side, and the icon after 400 ms, so that a quick opening never shows it. The app,
         drawn, takes its place. See design/opening.md, section 9. -->
    <style>
      html { background: #1e2229; }
      @media (prefers-color-scheme: light) { html { background: #fbfbfc; } }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot img { width: 64px; height: 64px; opacity: 0; animation: boot-in 0.25s ease-out 0.4s forwards; }
      @keyframes boot-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation-duration: 0s; } }
    </style>
    <script>
      try {
        const kept = JSON.parse(localStorage.getItem('scrawl.boot') || 'null');
        if (kept && kept.bg) document.documentElement.style.background = kept.bg;
        if (kept && kept.side) document.querySelector('meta[name="theme-color"]').setAttribute('content', kept.side);
      } catch {
        // Nothing kept, or no storage: the device's light or dark side.
      }
    </script>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><img src="/icons/icon-192.png" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
